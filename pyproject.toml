[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ethlib"
version = "0.3.0"
description = "Formally verified Ethereum primitives, written in Lean"
readme = { file = "README.md", content-type = "text/markdown" }
license = "CC0-1.0 AND MIT AND Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "ethereum" }]
urls = { homepage = "https://github.com/ethereum/ethlib" }

[project.optional-dependencies]
test = [
  "pytest==9.2.0",
  "pytest-xdist==3.8.0",
  "ruamel.yaml==0.19.1",
  "py_ecc==8.0.0",
]

[dependency-groups]
lint = [
  "codespell==2.4.3",
  "ruff==0.17.3",
  "ty==0.0.95",
]

[tool.uv]
# Rebuild the native extension only when its source or build inputs change.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "setup.py" },
  { file = "README.md" },
  { file = "MANIFEST.in" },
  { file = "lean-toolchain" },
  { file = "lakefile.lean" },
  { file = "lake-manifest.json" },
  { file = "EthLib.lean" },
  { file = "EthLib/**/*.lean" },
  { file = "bindings/python/**/*.c" },
  { file = "bindings/python/**/*.h" },
  { file = "bindings/python/**/*.py" },
]

[tool.pytest.ini_options]
testpaths = ["bindings/python/tests"]
pythonpath = ["bindings/python/tests"]
# importlib import mode keeps the per-suite fixtures.py files from
# clashing in sys.modules during collection.
addopts = "--import-mode=importlib"
markers = [
  "archive(name, *paths): reads the paths of a release archive of tests/sources.toml; skipped unless ETHLIB_ARCHIVES names a cache directory",
]

[tool.ruff]
line-length = 100
# The modules of these directories are first-party, as for the type checker.
src = ["bindings/python", "bindings/python/tests", "scripts"]
# The scripts and the suites run on Python 3.12, and the package supports Python 3.10.
target-version = "py312"
per-file-target-version = { "bindings/python/ethlib/**" = "py310", "setup.py" = "py310" }
# `lake exe gen-bindings` writes the stub, and its check compares it byte for byte.
# tests/consensus/pq_keys/SHA256SUMS pins the key generator by its digest.
extend-exclude = [
  "bindings/python/ethlib/cryptography/_native.pyi",
  "tests/consensus/pq_keys/generate.py",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
# D213 is selected by exact code: the google convention would otherwise disable it.
select = ["E", "F", "B", "W", "I", "A", "N", "D", "D213", "C", "TID", "UP"]
ignore = ["D205", "D203", "D212", "D415", "C901", "A005", "C420"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["ethlib"]
# The benchmarks import python-snappy and ssz-specs, whose names two suites share.
known-third-party = ["snappy", "ssz"]

[tool.ruff.lint.per-file-ignores]
# Each suite imports its own `fixtures` module, which shares its name with the other suites',
# so a suite reaches it by a relative import.
"bindings/python/tests/**" = ["D", "TID252"]
"scripts/test_*.py" = ["D"]
"tests/**" = ["D"]
# A benchmark builds each timed input in a lambda default, outside the timing,
# and names the modules and types of the specifications by one letter.
"benchmarks/*.py" = ["B008", "N803", "N812", "N814"]
# The evaluator dispatches on the name of each `ast` node class.
"bindings/python/tests/precompile/extract_alt_bn128_cases.py" = ["N802"]

[tool.codespell]
# Names in the code: a re-encoding, plural data, a serializer, a truncated status, a regex,
# and "Caf" before the escaped byte of "Café".
ignore-words-list = "caf,datas,ommit,reencode,ser,statu"

[tool.ty.environment]
python-version = "3.12"
# The package, and the directories whose modules the suites and the scripts import by bare name.
root = ["bindings/python", "bindings/python/tests", "scripts"]

[tool.ty.src]
# The benchmarks and the key generator import the reference specifications,
# which only their own environments install.
exclude = [".claude/", "benchmarks/", "tests/consensus/pq_keys/generate.py"]

[tool.ty.analysis]
# setup.py runs in the build environment, which installs setuptools.
allowed-unresolved-imports = ["setuptools", "setuptools.**"]

[tool.ty.rules]
# Flag any suppression comment that no longer matches a real diagnostic.
unused-ignore-comment = "error"

[tool.ty.terminal]
error-on-warning = true

# Findings in the code today, each directory removed from this list by the change that fixes it.
[[tool.ty.overrides]]
include = ["bindings/python/ethlib/**", "bindings/python/tests/**", "scripts/**", "tests/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
no-matching-overload = "ignore"
not-iterable = "ignore"
not-subscriptable = "ignore"
unresolved-attribute = "ignore"
unsupported-operator = "ignore"
