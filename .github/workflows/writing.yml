# Report optional wording suggestions for pull request prose.
#
# Suggestions and unsupported-input notices return success.
# Git, usage and configuration errors, and failures of the tests, fail the job.
#
# The description comes from the pull request author, so it reaches the script
# through an environment variable and is never interpolated into a command.

name: writing

on:
  # "edited" runs the check again when the description changes.
  # A stacked pull request is checked against its own base branch.
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  writing:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The check finds the changed prose from the merge base, so it needs the history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false

      - name: checker tests
        run: uv run --no-project --python 3.12 python -m unittest scripts/test_check_writing.py

      - name: changed prose (warnings only)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run --no-project --python 3.12 python scripts/check_writing.py --base "origin/${BASE_REF}" --github

      - name: pull request description (warnings only)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" | uv run --no-project --python 3.12 python scripts/check_writing.py --stdin description --github
