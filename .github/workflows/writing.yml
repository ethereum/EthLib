# Check the prose of a pull request against WRITING.md.
#
# Prose findings are warnings, and the checker exits with status 0 when it runs.
# Checker errors and failures of its tests fail the job.
#
# The description comes from the pull request author, so it reaches the script
# through an environment variable and is never interpolated into a command.

name: writing

on:
  # "edited" runs the check again when the description changes.
  # A stacked pull request is checked against its own base branch.
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  writing:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The check finds the changed prose from the merge base, so it needs the history.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: false

      - name: checker tests
        run: uv run --no-project --python 3.12 python -m unittest scripts/test_check_writing.py

      - name: changed prose (warnings only)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run --no-project --python 3.12 python scripts/check_writing.py --base "origin/${BASE_REF}" --github

      - name: pull request description (warnings only)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" | uv run --no-project --python 3.12 python scripts/check_writing.py --stdin description --github
