# Run the vector suites that are too slow or too large for each change.
#
# ci.yml runs the vector suites on each change, but skips two kinds of test.
# The key generation and signing cases of leanXMSS and leanSPHINCS take minutes each.
# A test marked `archive` reads a release archive that tests/sources.toml pins, which
# scripts/fetch_archives.py downloads and checks.
# This workflow runs both every Monday and on manual dispatch, one job per suite, so that
# no job nears the time limit.
# A regenerated vector that differs from the committed one fails the job.

name: vectors-slow

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vectors:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every vector suite, with the slow cases.
          - suite: slow
            bindings: true
            run: ETHLIB_SLOW_VECTORS=1 uv run --no-sync pytest -m "not archive"
          # The vendored blocks, receipts and transaction tests against their release.
          - suite: execution-spec-tests
            bindings: true
            run: >-
              uv run --no-sync pytest -m archive
              bindings/python/tests/blocks/test_archive.py
              bindings/python/tests/transactions/test_archive.py
          # The pinned BLS and KZG digests against the releases that published them.
          - suite: cryptography
            bindings: false
            run: uv run --no-project --python 3.12 python tests/cryptography/check_vectors.py --upstream

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: false

      # The latest build that ci.yml saved on master, read only.
      - name: restore EthLib build
        if: matrix.bindings
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .lake/build
          key: ethlib-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            ethlib-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - if: matrix.bindings
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-mathlib-cache: true
          use-github-cache: false

      - name: library
        if: matrix.bindings
        run: lake build --wfail EthLib Exports

      - name: bindings
        if: matrix.bindings
        run: uv sync --frozen --extra test

      - name: ${{ matrix.suite }}
        env:
          ETHLIB_ARCHIVES: ${{ runner.temp }}/archives
        run: ${{ matrix.run }}

      # The suites write every case, so a changed or a new case shows up here.
      - name: unchanged vectors
        run: |
          git status --porcelain -- tests bindings/python/tests
          test -z "$(git status --porcelain -- tests bindings/python/tests)"

      - name: pinned digests
        run: uv run --no-project --python 3.12 python tests/cryptography/check_vectors.py
