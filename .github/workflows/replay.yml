# Replay every declaration of EthLib into Lean's kernel with leanchecker, after the build.
#
# The replay repeats the kernel work of the proofs, so it does not run on pull requests.
# It runs on each push to master and every Monday.

name: replay

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

# A push does not cancel a scheduled run, which has its own group.
# On master the running replay finishes, and a newer pending run replaces the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  leanchecker:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The latest build that ci.yml saved on master, read only.
      - name: restore EthLib build
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .lake/build
          key: ethlib-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            ethlib-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          auto-config: false
          use-mathlib-cache: true
          use-github-cache: false

      - name: build
        run: lake build --wfail

      # Each module replays in its own process, which loads all its imports, Mathlib included.
      # The largest measured 5.6 GB with GNU time, so two at a time fit the 16 GB runner.
      - name: replay with leanchecker
        env:
          REPLAY_JOBS: "2"
        run: bash scripts/replay.sh
