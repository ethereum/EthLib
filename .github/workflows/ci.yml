# Build the specs and their proofs, check their compiled declarations, run the
# test-vector suites, and check the pinned test vectors.
#
# The suites need only the library, so they run in a job of their own, beside the proofs.
# Checking the vectors' digests needs no build, so it has a job of its own.

name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      clean_build:
        description: Build EthLib without restoring its build cache or the dependency builds
        type: boolean
        default: false

# On master the running run finishes and a newer pending run replaces the older; PRs still cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILD_TIMING_SOURCE_SHA: ${{ github.sha }}
      BUILD_TIMING_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      # The first parent of a pull request's merge commit is the base branch.
      # The memory step compares the two commits to find the changed Lean files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false

      - name: initialize timing paths
        run: |
          echo "BUILD_TIMING_RESULTS=$RUNNER_TEMP/ethlib-build-timing/results.jsonl" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_LOG_DIR=$RUNNER_TEMP/ethlib-build-timing" >> "$GITHUB_ENV"

      # Keep EthLib's artifacts apart from Mathlib, whose cache is fetched below.
      # The toolchain and manifest prevent reuse across incompatible dependencies.
      - name: restore EthLib build
        if: inputs.clean_build != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: ethlib-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ethlib-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: keep earlier module times
        run: |
          mkdir -p "$BUILD_TIMING_LOG_DIR"
          if [ -f .lake/build/ethlib-module-times.json ]; then
            cp .lake/build/ethlib-module-times.json "$BUILD_TIMING_LOG_DIR/module-times-base.json"
          fi

      # Installs elan and the Lean toolchain; only this step gets the token.
      # The builds run as named steps below, so the log shows which part failed.
      - name: install Lean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/install_elan.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: fetch the Mathlib cache
        run: lake exe cache get

      # The Mathlib cache does not hold these packages, so without this step every run builds them.
      # Lake compares content hashes, so it rebuilds any restored module whose inputs differ.
      - name: restore dependency builds
        if: inputs.clean_build != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/packages/VCVio/.lake/build
            .lake/packages/PolyFun/.lake/build
            .lake/packages/cslib/.lake/build
          key: ethlib-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ethlib-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      # The library alone comes first, so a broken specification fails before the proofs.
      # An unfinished proof only warns, so warnings have to be fatal.
      - name: library
        run: bash scripts/build_timing_report.sh run library_build "$BUILD_TIMING_RESULTS" -- lake build --wfail EthLib


      # Time Lean exports separately from the Python package build.
      - name: exports
        id: exports
        run: bash scripts/build_timing_report.sh run exports_build "$BUILD_TIMING_RESULTS" -- lake build --wfail Exports

      # The C docstrings, the contract and the type stub must match the Lean docstrings and codes.
      - name: binding contract
        run: lake exe gen-bindings --check

      # The Unicode table in Lean must match the pinned UnicodeData.txt.
      - name: unicode table
        run: uv run --no-project --python 3.12 python scripts/generate_unicode_nfkd.py --check

      # The build pipeline regressions below run in this Python environment,
      # so it syncs even when the contract check above fails.
      # The sync builds the exports again, so it runs only when they built above.
      - name: bindings
        id: bindings
        if: ${{ !cancelled() && steps.exports.outcome == 'success' }}
        run: bash scripts/build_timing_report.sh run bindings_build "$BUILD_TIMING_RESULTS" -- uv sync --frozen --extra test

      # The steps below run even after a failed step above, so every result is reported.
      - name: proofs
        id: proofs
        if: ${{ !cancelled() }}
        run: bash scripts/build_timing_report.sh run proofs_build "$BUILD_TIMING_RESULTS" -- lake build --wfail

      # Elaborate each Lean file that the pull request adds or changes once more.
      # The job summary shows its time and its peak memory.
      # On the 16 GB runner, a file above 4 GiB warns, and a file above 6 GiB fails.
      - name: memory of changed files
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        # An explicit bash sets pipefail, so a failed diff fails the step.
        shell: bash
        run: |
          git diff --name-only --diff-filter=AMR -z HEAD^1 HEAD -- EthLib.lean 'EthLib/*.lean' \
            | xargs -0 uv run --no-project --python 3.12 python scripts/check_memory.py \
                --summary "$GITHUB_STEP_SUMMARY"

      # Every compiled declaration: its axioms, and anything the kernel cannot
      # unfold or the compiler runs differently. Only the findings that exist
      # today, listed in scripts/check_decls_baseline.txt, pass.
      - name: declarations
        if: ${{ !cancelled() }}
        run: bash scripts/build_timing_report.sh run declarations "$BUILD_TIMING_RESULTS" -- lake exe check-decls

      # The check must report exactly what its fixtures plant.
      - name: declaration check fixtures
        if: ${{ !cancelled() }}
        run: scripts/test_check_decls.sh

      - name: module system regression
        if: ${{ !cancelled() }}
        run: bash scripts/test_module_system.sh

      # A separate package that requires EthLib, as a downstream project does, must still build.
      # EthLib is built above, so this elaborates one small file, in a few seconds.
      # The package has no manifest, so Lake resolves it from the root's; Mathlib's update hook
      # would then fetch its cache, which the packages built above make unneeded.
      - name: downstream package
        if: ${{ !cancelled() && steps.proofs.outcome == 'success' }}
        working-directory: tests/downstream
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
        run: lake build --wfail

      - name: timing report fixtures
        if: ${{ !cancelled() }}
        run: uv run --no-project --python 3.12 python -m unittest discover -s scripts -p 'test_build_timing.py'

      # These tests import the test extra, which only the bindings step installs.
      - name: build pipeline regressions
        if: ${{ !cancelled() && steps.bindings.outcome == 'success' }}
        run: uv run --no-sync python -m unittest discover -s scripts -p 'test_build_pipeline.py'

      # A failed run still publishes its logs and the status of each measured command.
      - name: build timing report
        if: ${{ always() }}
        run: |
          mkdir -p "$BUILD_TIMING_LOG_DIR"
          uv run --no-project --python 3.12 python scripts/module_times.py update .lake/build/ethlib-module-times.json \
            --commit "$GITHUB_SHA" \
            "$BUILD_TIMING_LOG_DIR/library_build.log" \
            "$BUILD_TIMING_LOG_DIR/exports_build.log" \
            "$BUILD_TIMING_LOG_DIR/bindings_build.log" \
            "$BUILD_TIMING_LOG_DIR/proofs_build.log"
          cp .lake/build/ethlib-module-times.json "$BUILD_TIMING_LOG_DIR/module-times.json"
          bash scripts/build_timing_report.sh render "$BUILD_TIMING_RESULTS" \
            > "$BUILD_TIMING_LOG_DIR/report.md"
          cat "$BUILD_TIMING_LOG_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: upload build timing
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ethlib-build-timing
          path: ${{ runner.temp }}/ethlib-build-timing
          if-no-files-found: warn
          retention-days: 30

      # Only successful master pushes publish a cache for later builds to consume.
      - name: prepare EthLib cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: bash scripts/prepare_build_cache.sh

      - name: save EthLib build
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: ethlib-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Each master run saves under a new key, so the newest entry holds every module imported now.
      - name: prepare dependency cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          for package in VCVio PolyFun cslib; do
            bash scripts/prepare_build_cache.sh ".lake/packages/$package/.lake/build"
          done

      - name: save dependency builds
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/packages/VCVio/.lake/build
            .lake/packages/PolyFun/.lake/build
            .lake/packages/cslib/.lake/build
          key: ethlib-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

  # The vector suites run the library through the bindings, so they do not wait for the proofs.
  # They run on each Python version from 3.10 to 3.14, so a feature that an older version lacks
  # fails here and not first in the wheel test of a release.
  # They also run on the free-threaded 3.14t build, where the extension runs without the GIL.
  suites:
    name: suites (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
    env:
      BUILD_TIMING_SOURCE_SHA: ${{ github.sha }}
      BUILD_TIMING_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
      # uv sync and uv run use this Python instead of the one in .python-version.
      UV_PYTHON: ${{ matrix.python }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false

      - name: initialize timing paths
        run: |
          echo "BUILD_TIMING_RESULTS=$RUNNER_TEMP/ethlib-suites-timing/results.jsonl" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_LOG_DIR=$RUNNER_TEMP/ethlib-suites-timing" >> "$GITHUB_ENV"

      # This job only reads the cache. The build job saves it.
      - name: restore EthLib build
        if: inputs.clean_build != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: ethlib-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ethlib-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: install Lean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/install_elan.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # The library and the exports import no module of Mathlib or of the other packages.
      # So this step only clones the packages, which Lake needs to load the workspace.
      - name: fetch the dependencies
        run: lake env true

      - name: library
        run: bash scripts/build_timing_report.sh run library_build "$BUILD_TIMING_RESULTS" -- lake build --wfail EthLib

      - name: exports
        run: bash scripts/build_timing_report.sh run exports_build "$BUILD_TIMING_RESULTS" -- lake build --wfail Exports

      - name: bindings
        run: bash scripts/build_timing_report.sh run bindings_build "$BUILD_TIMING_RESULTS" -- uv sync --frozen --extra test

      # One test process per core, and the 25 slowest tests in the log.
      # An idle process takes queued tests from a busy one, so a few long consensus cases do not run alone at the end.
      - name: vector suites
        run: bash scripts/build_timing_report.sh run test_path "$BUILD_TIMING_RESULTS" -- uv run --no-sync pytest -n auto --dist worksteal --durations=25

      # The catalogue checks of the consensus parity read the member lists of its two archives.
      # Without them, the check that each runnable group keeps vendored cases skips.
      # The fetcher downloads an archive only when its member list is missing from the cache.
      - name: restore archive member lists
        if: matrix.python == '3.12'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/archives/*.members.json
          key: ethlib-archive-members-${{ hashFiles('tests/sources.toml') }}
          restore-keys: |
            ethlib-archive-members-

      - name: consensus parity catalogue
        if: matrix.python == '3.12'
        env:
          ETHLIB_ARCHIVES: ${{ runner.temp }}/archives
        run: >-
          uv run --no-sync pytest -m archive bindings/python/tests/parity/test_consensus.py
          -k "not test_case"

      # The pinned history files check the layout that the format documents leave open.
      - name: pinned history files
        if: matrix.python == '3.12'
        env:
          ETHLIB_ARCHIVES: ${{ runner.temp }}/archives
        run: uv run --no-sync pytest -m archive bindings/python/tests/history

      # The generators rewrite every case, so a changed vector shows up as a diff.
      - name: unchanged vectors
        run: git diff --exit-code -- tests/cryptography

      - name: suites timing report
        if: ${{ always() }}
        run: |
          mkdir -p "$BUILD_TIMING_LOG_DIR"
          bash scripts/build_timing_report.sh render "$BUILD_TIMING_RESULTS" \
            > "$BUILD_TIMING_LOG_DIR/report.md"
          cat "$BUILD_TIMING_LOG_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: upload suites timing
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ethlib-suites-timing-python-${{ matrix.python }}
          path: ${{ runner.temp }}/ethlib-suites-timing
          if-no-files-found: warn
          retention-days: 30

  # Whether a change reaches the execution parity suite, and the shard of 200 that samples it.
  # scripts/parity_sample.py decides from the imports of the suite and from a list of fixed files.
  # The hash of the pull request's head commit, or of the pushed commit, picks the shard.
  parity-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.sample.outputs.run }}
      shard: ${{ steps.sample.outputs.shard }}

    steps:
      # The first parent of a pull request's merge commit is the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false

      # A push compares the last commit before it with the pushed commit, so every commit of the push counts.
      # A pull request compares its merge commit with the base branch.
      - name: reached paths
        id: sample
        shell: bash
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          base=HEAD^1
          if [ -n "$BEFORE" ] && git fetch --quiet --depth=1 origin "$BEFORE"; then
            base=$BEFORE
          fi
          git diff --name-only "$base" HEAD \
            | uv run --no-project --python 3.12 python scripts/parity_sample.py "$COMMIT" 200 \
            >> "$GITHUB_OUTPUT"

  # One shard of the execution parity suite, which vectors-slow.yml runs whole each week.
  # A shard holds about 1,800 cases.
  # On GitHub runners in November 2026, a run that downloaded the archive took about 6 minutes.
  # Of those, the build took 2 minutes, and the download and the shard together 2.6 minutes.
  # A change that breaks 1,000 cases escapes the sample with probability 0.7 percent.
  parity-sample:
    needs: parity-plan
    if: needs.parity-plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false

      - name: restore EthLib build
        if: inputs.clean_build != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: ethlib-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ethlib-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: install Lean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/install_elan.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # The library and the exports import no module of Mathlib or of the other packages.
      # So this step only clones the packages, which Lake needs to load the workspace.
      - name: fetch the dependencies
        run: lake env true

      - name: library
        run: lake build --wfail EthLib Exports

      - name: bindings
        run: uv sync --frozen --extra test

      # The pinned release of execution-spec-tests, about 940 MB, which the fetcher checks.
      # A new pin changes the key, so a run never reads a stale archive.
      - name: restore the archive
        id: archive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/archives/*.tar.gz
          key: ethlib-execution-archive-${{ hashFiles('tests/sources.toml') }}

      # To replay a failure, set ETHLIB_ARCHIVES to a cache directory and run this command with the printed shard.
      - name: execution parity sample
        env:
          ETHLIB_ARCHIVES: ${{ runner.temp }}/archives
          ETHLIB_PARITY_SHARD: ${{ needs.parity-plan.outputs.shard }}
        run: |
          echo "ETHLIB_PARITY_SHARD=$ETHLIB_PARITY_SHARD"
          uv run --no-sync pytest -n auto --dist worksteal -m archive \
            bindings/python/tests/parity/test_execution.py

      # Only master saves the archive, in the one cache entry that every pull request can read.
      - name: save the archive
        if: >-
          !cancelled() && steps.archive.outputs.cache-hit != 'true'
          && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/archives/*.tar.gz
          key: ethlib-execution-archive-${{ hashFiles('tests/sources.toml') }}

  vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false


      # Every pinned vector must match its recorded digest.
      # Only the standard library is used, so the runner's Python is enough.
      - run: uv run --no-project --python 3.12 python tests/cryptography/check_vectors.py

      # The check must fail on a missing manifest and on a changed, unlisted
      # or deleted case.
      - run: uv run --no-project --python 3.12 python -m unittest tests/cryptography/test_check_vectors.py

  # Lint, format-check, type-check and spell-check the Python code, with the tools that uv.lock pins.
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false

      - name: lock file
        run: uv lock --check

      # The type checker reads the test dependencies and the stub of the extension.
      # So the extension itself, which needs a Lean build, stays out.
      - name: install the tools
        run: uv sync --locked --python 3.12 --extra test --group lint --no-install-project

      - name: lint
        run: uv run --no-sync ruff check --no-fix --show-fixes

      - name: format
        run: uv run --no-sync ruff format --check

      - name: types
        run: uv run --no-sync ty check

      - name: spelling
        run: git ls-files -z '*.py' | xargs -0 uv run --no-sync codespell

      # Each test expects the whole message of an exception, through the helper of raising.py.
      - name: exception messages
        run: uv run --no-sync python scripts/check_raises.py

      - name: exception messages, unit tests
        run: uv run --no-sync python -m unittest scripts/test_check_raises.py

      - name: release watcher, unit tests
        run: uv run --no-sync python -m unittest scripts/test_check_spec_releases.py

      - name: parity shard merge, unit tests
        run: uv run --no-sync python -m unittest scripts/test_merge_parity.py

      - name: parity sample selection, unit tests
        run: uv run --no-sync python -m unittest scripts/test_parity_sample.py

      # A module docstring is one line, and no docstring wraps a sentence onto a second line.
      - name: docstrings
        run: uv run --no-sync python scripts/check_docstrings.py

      - name: docstrings, unit tests
        run: uv run --no-sync python -m unittest scripts/test_check_docstrings.py

  soundness:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The layout check finds the changed lines from the merge base, so it needs the history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false


      # SOUNDNESS.md must name the package version in pyproject.toml, and its
      # generated facts must match the repository. These checks use only the
      # standard library, without installing the native bindings.
      - run: uv run --no-project --python 3.12 python scripts/soundness_facts.py --check

      # The generator must count exports however they are written, count
      # calls rather than declarations, and fail on each kind of drift.
      - run: uv run --no-project --python 3.12 python -m unittest scripts/test_soundness_facts.py

      # Every import follows the rules of ARCHITECTURE.md, and every module is reached
      # from a library root.
      - run: uv run --no-project --python 3.12 python scripts/check_layers.py

      - run: uv run --no-project --python 3.12 python -m unittest scripts/test_check_layers.py

      # Every C export that reads a fork name caps it at the last fork whose rules it holds.
      - run: uv run --no-project --python 3.12 python scripts/check_fork_cap.py

      - run: uv run --no-project --python 3.12 python -m unittest scripts/test_check_fork_cap.py

      # Every test cites only the pinned commits of tests/sources.toml, and every pinned
      # vector directory names its sources.
      # pyproject.toml and lakefile.lean declare one release version.
      - run: uv run --no-project --python 3.12 python scripts/release_manifest.py --check

      - run: uv run --no-project --python 3.12 python -m unittest scripts/test_release_manifest.py

      - run: uv run --no-project --python 3.12 python scripts/check_fixture_pins.py

      - run: uv run --no-project --python 3.12 python -m unittest scripts/test_check_fixture_pins.py

      # The fetcher of the release archives checks each digest and unpacks no unsafe member.
      - run: uv run --no-project --python 3.12 python -m unittest scripts/test_fetch_archives.py

      # Each Lean line that a pull request changes has at most 100 characters.
      # In a comment, no two sentence lines touch, and no sentence runs onto a second line.
      # Lines that the pull request does not change are not checked.
      - name: Lean layout of the changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run --no-project --python 3.12 python scripts/check_lean_layout.py --base "origin/${BASE_REF}" --github

      # No sentence of a Lean comment runs onto a second line, in any file.
      - name: Lean comments, one sentence per line
        run: uv run --no-project --python 3.12 python scripts/check_lean_layout.py --all --rule wrap --github

      - run: uv run --no-project --python 3.12 python -m unittest scripts/test_check_lean_layout.py

      # A pull request adds no hand conversion to the Python package.
      # The allowlist names every conversion that remains.
      - name: Python package, no hand conversion on the changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run --no-project --python 3.12 python scripts/check_python_boundary.py --base "origin/${BASE_REF}"

      - name: Python package, no hand conversion outside the allowlist
        run: uv run --no-project --python 3.12 python scripts/check_python_boundary.py

      - run: uv run --no-project --python 3.12 python -m unittest scripts/test_check_python_boundary.py

      # No sentence of a Python comment runs onto a second line, in any file.
      - name: Python comments, one sentence per line
        run: uv run --no-project --python 3.12 python scripts/check_python_comments.py --all --github

      - run: uv run --no-project --python 3.12 python -m unittest scripts/test_check_python_comments.py
