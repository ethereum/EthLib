# Build the specs and their proofs, check their compiled declarations, run the
# test-vector suites, and check the pinned test vectors.
#
# The suites need only the library, so they run before the proofs, in the same job.
# Checking the vectors' digests needs no build, so it has a job of its own.

name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      clean_build:
        description: Build EthLib without restoring its build cache or the dependency builds
        type: boolean
        default: false

# On master the running run finishes and a newer pending run replaces the older; PRs still cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILD_TIMING_SOURCE_SHA: ${{ github.sha }}
      BUILD_TIMING_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      # The first parent of a pull request's merge commit is the base branch.
      # The memory step compares the two commits to find the changed Lean files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: false

      - name: initialize timing paths
        run: |
          echo "BUILD_TIMING_RESULTS=$RUNNER_TEMP/ethlib-build-timing/results.jsonl" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_LOG_DIR=$RUNNER_TEMP/ethlib-build-timing" >> "$GITHUB_ENV"

      # Keep EthLib's artifacts apart from Mathlib, whose cache is fetched below.
      # The toolchain and manifest prevent reuse across incompatible dependencies.
      - name: restore EthLib build
        if: inputs.clean_build != true
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .lake/build
          key: ethlib-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ethlib-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: keep earlier module times
        run: |
          mkdir -p "$BUILD_TIMING_LOG_DIR"
          if [ -f .lake/build/ethlib-module-times.json ]; then
            cp .lake/build/ethlib-module-times.json "$BUILD_TIMING_LOG_DIR/module-times-base.json"
          fi

      # Installs elan and fetches the mathlib cache.
      # The builds run as named steps below, so the log shows which part failed.
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          auto-config: false
          use-mathlib-cache: true

          # EthLib's build has its own cache; Mathlib uses its published cache.
          use-github-cache: false

      # The Mathlib cache does not hold these packages, so without this step every run builds them.
      # Lake compares content hashes, so it rebuilds any restored module whose inputs differ.
      - name: restore dependency builds
        if: inputs.clean_build != true
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            .lake/packages/VCVio/.lake/build
            .lake/packages/PolyFun/.lake/build
            .lake/packages/cslib/.lake/build
          key: ethlib-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ethlib-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      # The library alone comes first, so the vector suites run before the proofs.
      # An unfinished proof only warns, so warnings have to be fatal.
      - name: library
        run: bash scripts/build_timing_report.sh run library_build "$BUILD_TIMING_RESULTS" -- lake build --wfail EthLib


      # Time Lean exports separately from the Python package build.
      - name: exports
        run: bash scripts/build_timing_report.sh run exports_build "$BUILD_TIMING_RESULTS" -- lake build --wfail Exports

      # The C docstrings, the contract and the type stub must match the Lean docstrings and codes.
      - name: binding contract
        run: lake exe gen-bindings --check

      - name: bindings
        run: bash scripts/build_timing_report.sh run bindings_build "$BUILD_TIMING_RESULTS" -- uv sync --frozen --extra test

      # One test process per core, and the 25 slowest tests in the log.
      - name: vector suites
        run: bash scripts/build_timing_report.sh run test_path "$BUILD_TIMING_RESULTS" -- uv run --no-sync pytest -n auto --durations=25

      # The generators rewrite every case, so a changed vector shows up as a diff.
      - name: unchanged vectors
        run: git diff --exit-code -- tests/cryptography

      # The steps below run even after a failed suite, so every result is reported.
      - name: proofs
        if: ${{ !cancelled() }}
        run: bash scripts/build_timing_report.sh run proofs_build "$BUILD_TIMING_RESULTS" -- lake build --wfail

      # Elaborate each Lean file that the pull request adds or changes once more.
      # The job summary shows its time and its peak memory.
      # On the 16 GB runner, a file above 4 GiB warns, and a file above 6 GiB fails.
      - name: memory of changed files
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        # An explicit bash sets pipefail, so a failed diff fails the step.
        shell: bash
        run: |
          git diff --name-only --diff-filter=AMR -z HEAD^1 HEAD -- EthLib.lean 'EthLib/*.lean' \
            | xargs -0 uv run --no-project --python 3.12 python scripts/check_memory.py \
                --summary "$GITHUB_STEP_SUMMARY"

      # Every compiled declaration: its axioms, and anything the kernel cannot
      # unfold or the compiler runs differently. Only the findings that exist
      # today, listed in scripts/check_decls_baseline.txt, pass.
      - name: declarations
        if: ${{ !cancelled() }}
        run: bash scripts/build_timing_report.sh run declarations "$BUILD_TIMING_RESULTS" -- lake exe check-decls

      # The check must report exactly what its fixtures plant.
      - name: declaration check fixtures
        if: ${{ !cancelled() }}
        run: scripts/test_check_decls.sh

      - name: module system regression
        if: ${{ !cancelled() }}
        run: bash scripts/test_module_system.sh

      - name: timing report fixtures
        if: ${{ !cancelled() }}
        run: uv run --no-project --python 3.12 python -m unittest discover -s scripts -p 'test_build_timing.py'

      - name: build pipeline regressions
        if: ${{ !cancelled() }}
        run: uv run --no-sync python -m unittest discover -s scripts -p 'test_build_pipeline.py'

      # A failed run still publishes its logs and the status of each measured command.
      - name: build timing report
        if: ${{ always() }}
        run: |
          mkdir -p "$BUILD_TIMING_LOG_DIR"
          uv run --no-project --python 3.12 python scripts/module_times.py update .lake/build/ethlib-module-times.json \
            --commit "$GITHUB_SHA" \
            "$BUILD_TIMING_LOG_DIR/library_build.log" \
            "$BUILD_TIMING_LOG_DIR/exports_build.log" \
            "$BUILD_TIMING_LOG_DIR/bindings_build.log" \
            "$BUILD_TIMING_LOG_DIR/proofs_build.log"
          cp .lake/build/ethlib-module-times.json "$BUILD_TIMING_LOG_DIR/module-times.json"
          bash scripts/build_timing_report.sh render "$BUILD_TIMING_RESULTS" \
            > "$BUILD_TIMING_LOG_DIR/report.md"
          cat "$BUILD_TIMING_LOG_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: upload build timing
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ethlib-build-timing
          path: ${{ runner.temp }}/ethlib-build-timing
          if-no-files-found: warn
          retention-days: 30

      # Only successful master pushes publish a cache for later builds to consume.
      - name: prepare EthLib cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: bash scripts/prepare_build_cache.sh

      - name: save EthLib build
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .lake/build
          key: ethlib-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Each master run saves under a new key, so the newest entry holds every module imported now.
      - name: prepare dependency cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          for package in VCVio PolyFun cslib; do
            bash scripts/prepare_build_cache.sh ".lake/packages/$package/.lake/build"
          done

      - name: save dependency builds
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            .lake/packages/VCVio/.lake/build
            .lake/packages/PolyFun/.lake/build
            .lake/packages/cslib/.lake/build
          key: ethlib-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

  vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: false


      # Every pinned vector must match its recorded digest.
      # Only the standard library is used, so the runner's Python is enough.
      - run: uv run --no-project --python 3.12 python tests/cryptography/check_vectors.py

      # The check must fail on a missing manifest and on a changed, unlisted
      # or deleted case.
      - run: uv run --no-project --python 3.12 python -m unittest tests/cryptography/test_check_vectors.py

  soundness:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The layout check finds the changed lines from the merge base, so it needs the history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: false


      # SOUNDNESS.md must name the package version in pyproject.toml, and its
      # generated facts must match the repository. These checks use only the
      # standard library, without installing the native bindings.
      - run: uv run --no-project --python 3.12 python scripts/soundness_facts.py --check

      # The generator must count exports however they are written, count
      # calls rather than declarations, and fail on each kind of drift.
      - run: uv run --no-project --python 3.12 python -m unittest scripts/test_soundness_facts.py

      # Every import follows the rules of ARCHITECTURE.md, and every module is reached
      # from a library root.
      - run: uv run --no-project --python 3.12 python scripts/check_layers.py

      - run: uv run --no-project --python 3.12 python -m unittest scripts/test_check_layers.py

      # Every C export that reads a fork name caps it at the last fork whose rules it holds.
      - run: uv run --no-project --python 3.12 python scripts/check_fork_cap.py

      - run: uv run --no-project --python 3.12 python -m unittest scripts/test_check_fork_cap.py

      # Every test cites only the pinned commits of tests/sources.toml, and every pinned
      # vector directory names its sources.
      # pyproject.toml and lakefile.lean declare one release version.
      - run: uv run --no-project --python 3.12 python scripts/release_manifest.py --check

      - run: uv run --no-project --python 3.12 python -m unittest scripts/test_release_manifest.py

      - run: uv run --no-project --python 3.12 python scripts/check_fixture_pins.py

      - run: uv run --no-project --python 3.12 python -m unittest scripts/test_check_fixture_pins.py

      # The fetcher of the release archives checks each digest and unpacks no unsafe member.
      - run: uv run --no-project --python 3.12 python -m unittest scripts/test_fetch_archives.py

      # Each Lean line that a pull request changes has at most 100 characters, and no two
      # sentence lines of a comment touch. Lines that it does not change are not checked.
      - name: Lean layout of the changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run --no-project --python 3.12 python scripts/check_lean_layout.py --base "origin/${BASE_REF}" --github

      - run: uv run --no-project --python 3.12 python -m unittest scripts/test_check_lean_layout.py
