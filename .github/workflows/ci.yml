# Build the specs and their proofs, and check the pinned test vectors.
#
# The Python test-vector suites are too slow to run on every change, so
# they stay a local step for now. Checking the vectors' digests needs no
# build, so it runs on every change.

name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to a pull request supersedes the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Installs elan, fetches the mathlib cache, then builds both libraries.
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          # An unfinished proof only warns, so warnings have to be fatal.
          build-args: "--wfail"

          # Caching `.lake` is pointless: mathlib alone exceeds the 10 GB limit.
          use-github-cache: false

  vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Every pinned vector must match its recorded digest.
      # Only the standard library is used, so the runner's Python is enough.
      - run: python3 tests/cryptography/check_vectors.py

      # The check must fail on a missing manifest and on a changed, unlisted
      # or deleted case.
      - run: python3 -m unittest tests/cryptography/test_check_vectors.py
