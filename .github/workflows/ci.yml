# Build the specs and their proofs, check their compiled declarations, run the
# test-vector suites, and check the pinned test vectors.
#
# The suites need only the library, so they run before the proofs, in the same job.
# Checking the vectors' digests and encoding needs no Lean, so it has a job of its own.

name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to a pull request supersedes the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Installs elan and fetches the mathlib cache.
      # The builds run as named steps below, so the log shows which part failed.
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-mathlib-cache: true

          # Caching `.lake` is pointless: mathlib alone exceeds the 10 GB limit.
          use-github-cache: false

      # The library alone comes first, so the vector suites run before the proofs.
      # An unfinished proof only warns, so warnings have to be fatal.
      - name: library
        run: lake build --wfail EthLib

      # Each case must reproduce its committed file byte for byte.
      - name: vector suites
        run: cargo test --locked -p ethlib-generators --release --test vectors

      # The steps below run even after a failed suite, so every result is reported.
      - name: proofs
        if: ${{ !cancelled() }}
        run: lake build --wfail

      # Every compiled declaration: its axioms, and anything the kernel cannot
      # unfold or the compiler runs differently. Only the findings that exist
      # today, listed in scripts/check_decls_baseline.txt, pass.
      - name: declarations
        if: ${{ !cancelled() }}
        run: lake exe check-decls

      # The check must report exactly what its fixtures plant.
      - name: declaration check fixtures
        if: ${{ !cancelled() }}
        run: scripts/test_check_decls.sh

  vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Every pinned vector must match its recorded digest.
      # The crate does not link Lean, so the runner's Rust toolchain is enough.
      - run: cargo run --locked -p ethlib-vectors --bin check-vectors

      # The check must fail on a missing manifest and on a changed, unlisted or deleted case.
      # Every committed vector must also re-encode to the same bytes.
      - run: cargo test --locked -p ethlib-vectors
