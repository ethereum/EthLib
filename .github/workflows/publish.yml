# Build wheels on every supported platform/Python combo and publish to
# PyPI when a tag matching `v*` is pushed.

name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  build_wheels:
    name: wheels — ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-latest
            arch: arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: false


      # macOS runners build natively (no manylinux container), so elan
      # needs to be on the host. Linux runners install elan inside the
      # cibuildwheel container via CIBW_BEFORE_ALL_LINUX below.
      - name: Install elan (macOS host)
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/install_elan.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build wheels
        uses: pypa/cibuildwheel@8d2b08b68458a16aeb24b64e68a09ab1c8e82084 # v3.4.1
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD_FRONTEND: "build[uv]"
          # Python version filter comes from pyproject.toml's `requires-python`.
          # PyPy is off by default. Skip Alpine for now.
          CIBW_SKIP: "*-musllinux_*"

          # Lean 4's bundled clang needs GLIBC >= 2.29; manylinux_2_28
          # ships 2.28. manylinux_2_34 (GLIBC 2.34, ~RHEL 9 / Ubuntu 22.04)
          # is the lowest tag that works.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_34
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_34

          # Inside the manylinux container: install elan once, then
          # `setup.py`'s LakeThenBuild handler will call `lake build`
          # for each wheel.
          # The image has no zstd program, which unpacks the Lean archive.
          # The token stays outside the container: the release assets download without it.
          CIBW_BEFORE_ALL_LINUX: dnf install -y zstd && bash {project}/scripts/install_elan.sh

          # cibuildwheel expands $VAR at runtime in the container.
          CIBW_ENVIRONMENT_LINUX: PATH=$HOME/.elan/bin:$PATH

          # Force a fresh `lake build` per wheel to avoid stale objects
          # from a previous Python ABI's compile.
          CIBW_BEFORE_BUILD: lake clean

          # cibuildwheel creates this ABI-specific test environment with uv.
          # Each wheel runs the vector suites, then the check of the pinned vectors.
          CIBW_TEST_EXTRAS: test
          CIBW_TEST_COMMAND: bash {project}/scripts/test_wheel.sh {project}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

  build_sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: false
      - run: uv build --sdist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

  manifest:
    name: release manifest
    runs-on: ubuntu-latest
    steps:
      # The whole history, so that the notes can name the previous tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: false

      # pyproject.toml and lakefile.lean must declare one version, and a tag must be v<version>.
      - name: check the version and write the manifest
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          args=(--check --output release-manifest.json)
          if [ -n "$TAG" ]; then args+=(--tag "$TAG"); fi
          uv run --no-project --python 3.12 python scripts/release_manifest.py "${args[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          path: release-manifest.json

      # The notes of the GitHub release: the install line, the section of the version in
      # CHANGELOG.md, and the link to the changes since the previous tag.
      # This job runs before the upload to PyPI, so a missing section stops the release there.
      - name: write the release notes
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          REPO: ${{ github.repository }}
        run: |
          version=$(jq -r .version release-manifest.json)
          tag="v$version"
          awk -v head="## $version" '
            $0 == head { on = 1; next }
            on && /^## / { exit }
            on && /^$/ { if (started) blanks++; next }
            on { for (; blanks > 0; blanks--) print ""; print; started = 1 }
          ' CHANGELOG.md > section.md
          if [ ! -s section.md ]; then
            echo "::error::CHANGELOG.md has no section ## $version"
            exit 1
          fi
          if [ -n "$TAG" ] && grep -qx 'Not yet released.' section.md; then
            echo "::error::the section ## $version of CHANGELOG.md says that it is not yet released"
            exit 1
          fi
          previous=$({ git tag --list 'v*'; echo "$tag"; } | sort -uV \
            | awk -v tag="$tag" '$0 == tag { print prev; exit } { prev = $0 }')
          {
            echo "Install it with \`pip install ethlib==$version\` ([PyPI](https://pypi.org/project/ethlib/$version/))."
            echo
            cat section.md
            if [ -n "$previous" ]; then
              echo
              echo "**Full list of changes:** https://github.com/$REPO/compare/$previous...$tag"
            fi
          } > release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  publish:
    name: publish to PyPI
    needs: [build_wheels, build_sdist, manifest]
    runs-on: ubuntu-latest
    # Only publish on a real tag push, not a manual dispatch.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      # Only the wheels and the sdist: the upload to PyPI rejects any other file in dist.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist

      # A signed record that this workflow, at this commit, built each wheel and the sdist.
      # `gh attestation verify <file> -R ethereum/EthLib` checks a downloaded file against it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release:
    name: publish the GitHub release
    needs: [manifest, publish]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-manifest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      # Create the release of the tag, or replace the title and the notes of an existing one.
      # Then attach the manifest.
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          title="ethlib ${TAG#v}"
          if gh release view "$TAG" --repo "$REPO" > /dev/null; then
            gh release edit "$TAG" --repo "$REPO" --title "$title" --notes-file release-notes.md
          else
            gh release create "$TAG" --repo "$REPO" --verify-tag --title "$title" \
              --notes-file release-notes.md
          fi
          gh release upload "$TAG" release-manifest.json --repo "$REPO" --clobber
