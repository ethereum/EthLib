# Build wheels on every supported platform/Python combo and publish to
# PyPI when a tag matching `v*` is pushed.

name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build_wheels:
    name: wheels — ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-latest
            arch: arm64

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: false


      # macOS runners build natively (no manylinux container), so elan
      # needs to be on the host. Linux runners install elan inside the
      # cibuildwheel container via CIBW_BEFORE_ALL_LINUX below.
      - name: Install elan (macOS host)
        if: runner.os == 'macOS'
        run: |
          bash scripts/install_elan.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build wheels
        uses: pypa/cibuildwheel@8d2b08b68458a16aeb24b64e68a09ab1c8e82084 # v3.4.1
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD_FRONTEND: "build[uv]"
          # Python version filter comes from pyproject.toml's `requires-python`.
          # PyPy is off by default. Skip Alpine for now.
          CIBW_SKIP: "*-musllinux_*"

          # Lean 4's bundled clang needs GLIBC >= 2.29; manylinux_2_28
          # ships 2.28. manylinux_2_34 (GLIBC 2.34, ~RHEL 9 / Ubuntu 22.04)
          # is the lowest tag that works.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_34
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_34

          # Inside the manylinux container: install elan once, then
          # `setup.py`'s LakeThenBuild handler will call `lake build`
          # for each wheel.
          CIBW_BEFORE_ALL_LINUX: bash {project}/scripts/install_elan.sh

          # cibuildwheel expands $VAR at runtime in the container.
          CIBW_ENVIRONMENT_LINUX: PATH=$HOME/.elan/bin:$PATH

          # Force a fresh `lake build` per wheel to avoid stale objects
          # from a previous Python ABI's compile.
          CIBW_BEFORE_BUILD: lake clean

          # cibuildwheel creates this ABI-specific test environment with uv.
          # Each wheel runs the vector suites, then the check of the pinned vectors.
          CIBW_TEST_EXTRAS: test
          CIBW_TEST_COMMAND: bash {project}/scripts/test_wheel.sh {project}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

  build_sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: false
      - run: uv build --sdist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Only publish on a real tag push, not a manual dispatch.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # A signed record that this workflow, at this commit, built each wheel and the sdist.
      # `gh attestation verify <file> -R ethereum/EthLib` checks a downloaded file against it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
