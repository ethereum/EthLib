# Time EthLib against the Python specifications, on manual dispatch only.
#
# The job runs one round of benchmarks/run.sh, each side pinned to one core,
# and uploads the table and the raw results. It never gates a merge.

name: bench

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Number of rounds of the three sides
        type: string
        default: "1"
      only:
        description: Comma-separated rows to run, or empty for all
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: false

      # The latest build that ci.yml saved on master, read only.
      - name: restore EthLib build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: ethlib-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            ethlib-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          auto-config: false
          use-mathlib-cache: true
          use-github-cache: false

      - name: bindings
        run: uv sync --frozen --extra test

      - name: reference specifications and inputs
        run: benchmarks/setup.sh

      - name: benchmarks
        env:
          ROUNDS: ${{ inputs.rounds }}
          BENCH_ONLY: ${{ inputs.only }}
          CORE: "1"
        run: benchmarks/run.sh

      - name: upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: benchmarks/results/
