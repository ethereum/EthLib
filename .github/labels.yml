# The labels of the repository, as code.
#
# The workflow labels-sync.yml creates and updates these labels on every change to this file.
# It never deletes a label, so a label that is missing here stays on the repository.
# Each family has one hue: the parent label is dark and its children are light.
# labeler.yml maps paths to the area labels, and title-labels.yml maps titles to the rest.

