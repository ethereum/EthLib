# Types, from the conventional title that CONTRIBUTING.md defines.
- name: "type: feat"
  color: "ededed"
  description: "New behaviour, such as a new function, module or export"
- name: "type: fix"
  color: "ededed"
  description: "Behaviour that disagreed with the specification now agrees"
- name: "type: proof"
  color: "ededed"
  description: "New or changed theorems, with no change to the library code"
- name: "type: perf"
  color: "ededed"
  description: "The same results, computed faster"
- name: "type: refactor"
  color: "ededed"
  description: "The same behaviour, with the code restructured"
- name: "type: test"
  color: "ededed"
  description: "Test vectors, known answers or the Python suite"
- name: "type: docs"
  color: "ededed"
  description: "Documentation only"
- name: "type: build"
  color: "ededed"
  description: "Lake, the Lean toolchain, dependencies or packaging"
- name: "type: ci"
  color: "ededed"
  description: "The GitHub workflows"
- name: "type: chore"
  color: "ededed"
  description: "Anything else that touches no library code, proof or test"

# A title with ! before the colon marks a change that breaks consumers.
- name: "statement-change"
  color: "b60205"
  description: "Breaking change: the title has ! before the colon"

# Labels that existed before this file, kept with their values.
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"
- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"
- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "invalid"
  color: "e4e669"
  description: "This doesn't seem right"
- name: "question"
  color: "d876e3"
  description: "Further information is requested"
- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"
- name: "dependencies"
  color: "0366d6"
  description: "Pull requests that update a dependency file"
- name: "python:uv"
  color: "2b67c6"
  description: "Pull requests that update python:uv code"
- name: "github_actions"
  color: "000000"
  description: "Pull requests that update GitHub Actions code"
- name: "leanVM"
  color: "5319e7"
  description: "leanVM specification work: human review only, automated reviewers skip it"
