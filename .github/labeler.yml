# The area labels of a pull request, from the paths it changes.
#
# The paths job of workflows/labeler.yml applies them with sync-labels.
# So it also removes a label of this file once the pull request no longer changes a matching path.
# A child label, such as crypto: keccak, matches a subset of its parent's paths.
# So every file that gives a child also gives its parent.
# A module covers its file, its directory, its Proofs and Exports entries and its tests.
# Python tests named gossip or reqresp give no child, since both consensus and networking have them.
# labels.yml defines each label.

"crypto":
  - changed-files:
      - any-glob-to-any-file:
          - 'EthLib/Cryptography.lean'
          - 'EthLib/Cryptography/**'
          - 'tests/cryptography/**'
          - 'bindings/python/tests/aes/**'
          - 'bindings/python/tests/bls/**'
          - 'bindings/python/tests/ethash/**'
