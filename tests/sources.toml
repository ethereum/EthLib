# The sources of the test vectors and fixtures, with one pinned commit per repository.
#
# Every test that reads from a repository uses its pin.
# So two tests cannot check against two versions of one source.
# To move a pin, change it here and update every test that cites the repository.
# Do both in one pull request.
#
# A pinned vector directory holds a SHA256SUMS file.
# That file starts with one "# Source:" line for each source below that lists the directory.
# The README of the directory names the pinned commit of each repository.
#
# A release archive that is too large to vendor is pinned in the table `archives`.
# Its entry gives the URL, the size in bytes and the sha256 of the file.
# An archive can come from an older release than the pin of its repository.
# A repository without releases gives the source archive of its pinned commit.
# A test names the archive by its key, and reads it through scripts/fetch_archives.py.
# The fetcher checks the size and the digest.
#
#     uv run --no-project --python 3.12 python scripts/check_fixture_pins.py

