# The pinned vector directories whose cases come from no repository, with their source.
[other]
"tests/cryptography/hash_to_curve" = "RFC 9380, Appendices J.10.1, K.1 and K.2"
"tests/cryptography/keccak" = "KeccakKAT-3.zip of the Keccak team, and the digest of abc"
"tests/cryptography/sha256" = "NIST CAVP SHA256ShortMsg and SHA256LongMsg, and FIPS 180-2"
"tests/cryptography/sphincs" = "EthLib"
"tests/cryptography/xmss" = "EthLib, and an independent implementation for the known answers"
"bindings/python/tests/keccak/kat" = "KeccakKAT-3.zip of the Keccak team"
"bindings/python/tests/sha256/cavp" = "shabytetestvectors.zip of NIST CAVP"
