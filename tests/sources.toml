# The sources of the test vectors and fixtures, with one pinned commit per repository.
#
# Every test that reads from a repository uses its pin, so two tests cannot check against two
# versions of one source. To move a pin, change it here, then update and check every test that
# cites the repository, in one pull request.
#
# A pinned vector directory is a directory that holds a SHA256SUMS file. Its SHA256SUMS starts
# with one "# Source:" line for each source below that lists the directory, and the README that
# describes the directory names the pinned commit of each repository.
#
#     uv run --no-project --python 3.12 python scripts/check_fixture_pins.py

[repositories."ethereum/consensus-specs"]
commit = "84454a9d57f4f49f74c78e9f375347baf30474f2"
release = "v1.7.0-alpha.12"
directories = [
  "tests/consensus/parameters", "tests/cryptography/bls", "tests/cryptography/kzg",
]

[repositories."ethereum/bls12-381-tests"]
commit = "89ff3a86f1a9b89a555495f7535c853cda589320"
release = "v0.1.2"
directories = ["tests/cryptography/bls"]

[repositories."C2SP/wycheproof"]
commit = "d17cc89fa5c8f4f4d378b5385ebf75da5d0926c9"
directories = ["tests/cryptography/secp256k1", "tests/cryptography/secp256r1"]

[repositories."BLAKE2/BLAKE2"]
commit = "ed1974ea83433eba7b2d95c5dcd9ac33cb847913"

[repositories."ethereum/devp2p"]
commit = "88f1c80800d622cc3a542a2125bbe33cc18c9f9c"

[repositories."ethereum/EIPs"]
commit = "d386b29b5a31bd5cfd8d21bbf4e8a0c87734085e"

[repositories."ethereum/ERCs"]
commit = "be307c948f28897adb8f25afcc253c2c909de35d"

[repositories."ethereum/tests"]
commit = "c67e485ff8b5be9abc8ad15345ec21aa22e290d9"
directories = ["bindings/python/tests/rlp/vectors", "bindings/python/tests/state/genesis"]

[repositories."ethereum/execution-specs"]
