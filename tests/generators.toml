# Who computed the expected values of the test vectors, and which libraries compute them at run time.
#
# The pins of `tests/sources.toml` say where a vector comes from.
# This file says which program computed its expected values: outputs, post-states, verdicts and digests.
# A vector computed by the code that EthLib's definition was written from tests less than one computed apart from it.
# So each conformance claim can name its generator.
#
# The table `generators` defines each generator once, under a short name.
# Its `computes` field names the program, and the library that does the arithmetic when it is not the program itself.
# Its `version` field gives the versions that a file, a fixture or a lock file records, or says that none is recorded.
# Its `source` field is where a reader checks the claim, at a pinned commit where there is one.
# Its optional `imports` field lists the modules from outside the repository that the scripts of its directories import.
#
# Two names are reserved and need no definition:
# - "ethlib": EthLib computed the values, so the case is a regression test of EthLib, not a check of it.
# - "not established": no file, commit or document read so far names the program.
#   Such a group gives what was read in `checked`, and it never counts as independent.
#
# The table `directories` gives, for each directory that `tests/sources.toml` lists, its groups of cases.
# The table `archives` does the same for each release archive of `tests/sources.toml`.
# A group lists its files in `cases`, as globs relative to the directory, or to the top of the archive.
# Several groups can share one file, when each gives the part it covers in `subset`.
# Files named LICENSE, and Python files, hold no case and belong to no group.
#
# The table `runtime` lists the modules the Python tests import that are no part of EthLib, of the standard library or of the tests.
# A module that computes expected values while the tests run is an oracle.
# Any other module is a tool, and `runtime.tools` gives the reason it computes no expected value.
#
#     uv run --no-project --python 3.12 python scripts/check_fixture_pins.py
#
# The check fails when a directory or an archive has no entry, when a pinned file belongs to no group, and when a group names an undefined generator.
# It also fails when a test imports a module that `runtime` does not list, and when an oracle's version differs from `uv.lock`.
# It fails as well when a script in a directory imports a module that no generator of the directory lists in `imports`.
#
# The check downloads no archive.
# When `ETHLIB_ARCHIVES` names the cache of the archives, it also checks each glob of an archive against the member list that the cache holds.

# The Python specification of the consensus layer and the test vectors of its releases.

