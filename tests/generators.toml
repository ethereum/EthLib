# The modules that the Python tests run.

[runtime.tools]
eth_typing = "names the types of py_ecc's arguments, for the type checker"
hypothesis = "draws random inputs, and the expected value is the input itself or comes from code in the test"
pytest = "runs the tests"
ruamel = "parses the YAML files of the vectors"
tomli = "reads TOML on Python 3.10, which has no tomllib"

[runtime.oracles.py_ecc]
package = "py-ecc"
version = "8.0.0"
computes = "BLS12-381 signatures and points, alt_bn128 points and pairings, secp256k1 points"

[runtime.oracles.hashlib]
package = "python"
computes = "SHA-256 and BLAKE2b digests, PBKDF2 and scrypt"

[runtime.oracles.hmac]
package = "python"
computes = "HMAC-SHA256"

[runtime.oracles.zlib]
package = "python"
computes = "CRC-32"

[runtime.oracles.snappy_reference]
path = "bindings/python/tests/snappy_reference.py"
computes = "Snappy decompression, written from the format description apart from EthLib"

[runtime.oracles.trie_reference]
path = "bindings/python/tests/trie_reference.py"
computes = "Merkle Patricia trie roots and proofs, written from the Yellow Paper apart from EthLib, on EthLib's Keccak-256 and RLP"
