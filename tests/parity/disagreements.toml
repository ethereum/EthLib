# The cases of the official test suites on which EthLib knowingly disagrees.
#
# The parity tests of bindings/python/tests/parity run every runnable case.
# A case listed here must fail, and every other runnable case must pass.
# So a fixed disagreement fails until its entry is removed.
# The archive cases of bindings/python/tests/consensus/test_fork_choice.py read this file too.
#
# Each entry gives the suite, the case, the reason, and the source that supports the reason.
# The case is the identifier that the parity report uses.
# For execution-spec-tests, it is the test identifier of a fixture.
# For consensus-spec-tests, it is the directory of a case in the archive.
# For legacytests, it is the path of a file in the archive, two colons, and the name of a test.
# An entry can name the group of runners that disagrees, and then holds for that group only.
#
#     [[disagreement]]
#     suite = "execution-spec-tests"
#     case = "tests/...::test_...[fork_Osaka-transaction_test-...]"
#     reason = "..."
#     source = "EIP-... section ..."

# A block whose gas limit is 2^63, one above the gas limit of its parent.
# Clients cap the gas limit at 2^63 - 1, and the tests reject the block.
# The Yellow Paper bounds the gas limit only against the parent's, and from below by 5000.
# EIP-1985 would bound it by 2^63 - 1, but it is Stagnant, and no fork activates it.
# execution-specs accepts the block as well, and lists these tests as expected failures.

[[disagreement]]
suite = "legacytests"
case = "Constantinople/BlockchainTests/InvalidBlocks/bcInvalidHeaderTest/GasLimitHigherThan2p63m1.json::GasLimitHigherThan2p63m1_Frontier"
group = "legacy_header"
reason = "EthLib accepts a gas limit of 2^63, as execution-specs does, since no activated rule bounds it"
source = "Yellow Paper, Shanghai version, sections 4.4.3 and 4.4.4: the gas limit is a natural number. execution-specs e27f097: forks/frontier/blocks.py line 121 and forks/london/blocks.py line 130 type it as Uint, check_gas_limit at frontier/fork.py line 705 bounds it only by the parent and the minimum, and tests/json_loader/helpers/exceptional_test_patterns.py line 85 lists GasLimitHigherThan2p63m1 as expected_fail. EIP-1985 is Stagnant"

