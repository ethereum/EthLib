# The fast confirmation cases of v1.7.0-beta.4 whose answer depends on the weight of the committees.
# That release weighs the committees of a range of slots by an average per slot.
# The average does not bound a given committee, so the rule could confirm a block that an attack reorgs.
# EthLib weighs them exactly, as the paper and the later rule of consensus-specs do.
# A later release with the exact rule replaces these cases.

[[disagreement]]
suite = "consensus-spec-tests"
case = "tests/minimal/altair/fast_confirmation/empty_slots/pyspec_tests/fcr_handles_multiple_consecutive_empty_slots"
reason = "The case was generated with an average estimate of the committee weight, and EthLib weighs the committees exactly, so it confirms another block"
source = "arXiv 2405.00549v4, equation (6) and Definition 4: the safety threshold uses the exact weight of the committees, which Lemma 2 of Appendix A.1 needs. consensus-specs cc68498a51ceb7b1fb80b1c595ef5597ca4b3c2c, specs/phase0/fast-confirmation.md, compute_committee_weight_between_slots, replaces the estimate, and changes this case in test_empty_slots.py. The pinned v1.7.0-beta.4 archive predates that commit"

